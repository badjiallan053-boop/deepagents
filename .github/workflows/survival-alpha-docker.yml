name: survival-alpha-docker
on:
  push:
    branches: ["survival-alpha-paper"]
    paths: ["survival-alpha/**", ".github/workflows/survival-alpha-docker.yml"]
  pull_request:
    paths: ["survival-alpha/**", ".github/workflows/survival-alpha-docker.yml"]
permissions:
  contents: read
jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t survival-alpha:ci survival-alpha
      - name: Node 20 in image
        run: docker run --rm survival-alpha:ci node --version | grep -E '^v20\.'
      - name: Sidecar parses and resolves deps in image
        run: |
          docker run --rm survival-alpha:ci sh -c 'node --check pump_quote_service.mjs && node --check pump_quote_math.mjs && node -e "require(\"@pump-fun/pump-sdk\"); require(\"@solana/web3.js\")"'
      - name: App imports in image (paper DB)
        run: docker run --rm -e DATABASE_URL=sqlite:////tmp/ci.db survival-alpha:ci python -c "import app"
