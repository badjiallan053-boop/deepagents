services:
  - type: web
    name: survival-alpha-paper
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: JUPITER_API_KEY
        sync: false
      - key: HELIUS_API_KEY
        sync: false
      - key: PAPER_ADMIN_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false

      - key: REALTIME_ENABLED
        value: "true"
      - key: PAPER_NOTIONAL_LAMPORTS
        value: "40000000"
      - key: AUTO_PAPER
        value: "true"
      - key: MAX_OPEN_PAPER_POSITIONS
        value: "20"
      - key: PAPER_MAX_HOLD_SECS
        value: "300"
      - key: MAX_ROUNDTRIP_COST_BPS
        value: "800"
      - key: MAX_ADVERSE_500_BPS
        value: "500"
      - key: JUPITER_ORGANIC_MIN
        value: "50"
      - key: WATCH_WALLETS
        sync: false
      - key: PUMPPORTAL_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false