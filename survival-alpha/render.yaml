services:
  - type: web
    name: survival-alpha-paper
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: JUPITER_API_KEY
        sync: false
      - key: HELIUS_API_KEY
        sync: false
      - key: PAPER_ADMIN_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: survival-alpha-db
          property: connectionString

      - key: REALTIME_ENABLED
        value: "true"
      - key: PAPER_NOTIONAL_LAMPORTS
        value: "40000000"
      - key: AUTO_PAPER
        value: "true"
      - key: MAX_OPEN_PAPER_POSITIONS
        value: "20"
      - key: PAPER_MAX_HOLD_SECS
        value: "300"
      - key: MAX_ROUNDTRIP_COST_BPS
        value: "800"
      - key: MAX_ADVERSE_500_BPS
        value: "500"
      - key: JUPITER_ORGANIC_MIN
        value: "50"
      - key: WATCH_WALLETS
        sync: false
      - key: PUMPPORTAL_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TG_BOT_SIGNAL_CHAT_IDS
        sync: false
      - key: TG_API_ID
        sync: false
      - key: TG_API_HASH
        sync: false
      - key: TG_SESSION_STRING
        sync: false
      - key: TG_SIGNAL_CHANNELS
        sync: false
      - key: PUMP_QUOTER_URL
        value: "http://127.0.0.1:10001"

      - key: FIRM_PAPER_NAV_LAMPORTS
        value: "400000000"
      - key: FIRM_BASE_POSITION_BPS
        value: "250"
      - key: FIRM_MAX_SINGLE_POSITION_BPS
        value: "1000"
      - key: FIRM_MAX_GROSS_EXPOSURE_BPS
        value: "5000"
      - key: FIRM_MAX_SOURCE_EXPOSURE_BPS
        value: "2500"
      - key: FIRM_DAILY_LOSS_LIMIT_BPS
        value: "500"
      - key: FIRM_MAX_OPEN_POSITIONS
        value: "5"
      - key: FIRM_MIN_PROMOTION_SAMPLES
        value: "30"
      - key: FIRM_MIN_PROFIT_FACTOR
        value: "1.30"
      - key: FIRM_HOLD_SECONDS
        value: "300"
      - key: MARKOUT_HORIZONS_SECONDS
        value: "30,120,300,900"

databases:
  - name: survival-alpha-db
    region: singapore
    plan: free
    databaseName: survival_alpha
    user: survival_alpha
    ipAllowList: []
